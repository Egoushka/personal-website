# Sveltia CMS — https://sveltiacms.app
#
# Shares Decap's config format, so switching between the two is close to free if
# this one disappoints.
#
# Content stays in git and this edits the files directly — see ADR 0003. A
# database-backed CMS was the obvious alternative and was rejected because it
# would move posts out of the repo and kill the `post` and `review-post` skills
# and `npm run validate` along with them.
backend:
  name: github
  repo: Egoushka/personal-website
  branch: main
  # No base_url, and no OAuth worker: Sveltia's "Sign In Using Access Token"
  # works out of the box. You paste a fine-grained GitHub PAT into the CMS, it is
  # kept in your browser's localStorage, and it never touches this repo, the
  # server, or CI. That is strictly less infrastructure and one fewer secret than
  # an OAuth app plus a Cloudflare Worker.
  #
  # If you later want the "Sign In with GitHub" button instead, deploy
  # https://github.com/sveltia/sveltia-cms-auth and set base_url to the worker.

# Editing from a phone means editing on a flaky connection; save drafts remotely.
publish_mode: editorial_workflow

media_folder: assets/images
public_folder: /img

# The one vocabulary, mirroring lib/topics.ts. Adding a slug here without adding
# it there fails `npm run validate` in CI, which is the real gate.
topics: &topics
  - infrastructure
  - self-hosting
  - debugging
  - ci-cd
  - architecture
  - observability
  - retrieval
  - dotnet
  - aspnet
  - postgres
  - typescript
  - angular
  - docker
  - caddy
  - tailscale
  - sops
  - grafana
  - linux
  - hetzner
  - python
  - flutter

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: content/posts
    create: true
    slug: "{{fields.slug}}"
    # Mirrors scripts/validate-content.mjs. CI is still the real gate — this just
    # catches mistakes before they become a commit.
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - name: description
        label: Description
        widget: string
        hint: "Meta description and feed summary. Max 160 characters."
        pattern: ["^.{1,160}$", "Must be 1–160 characters"]
      - name: topics
        label: Topics
        widget: select
        multiple: true
        min: 1
        options: *topics
      - name: spanDays
        label: Span (days)
        widget: number
        required: false
        value_type: int
        min: 1
        hint: "Optional. The length of the stretch of time the piece is about — 51 for an essay about fifty-one days. Leave blank and nothing is printed."
      - { name: body, label: Body, widget: markdown }

  - name: drafts
    label: Drafts
    folder: content/drafts
    create: true
    slug: "{{fields.slug}}"
    # A draft is deliberately looser than a post: only the title is required, so
    # something half-formed can be saved without arguing with a validator.
    # Promoting it to content/posts/ is the reviewed step where the rules apply.
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: description, label: Description, widget: string, required: false }
      - { name: topics, label: Topics, widget: select, multiple: true, required: false, options: *topics }
      - { name: spanDays, label: Span (days), widget: number, required: false, value_type: int, min: 1 }
      - { name: body, label: Body, widget: markdown }
