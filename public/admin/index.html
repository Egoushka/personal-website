<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Keep the editor out of search results and out of Pagefind's index. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Content — hrabovskyi.online</title>
  </head>
  <body data-pagefind-ignore>
    <!--
      Sveltia CMS. A client-side SPA that talks to the GitHub API directly, so it
      needs no backend and does not touch the Next build — output: "export" is
      unaffected. Editing commits to main, which triggers the normal deploy.

      Vendored rather than loaded from a CDN: the site CSP is script-src 'self',
      and punching a hole in it for an editor would be a poor trade.
    -->
    <script src="/admin/sveltia-cms.js" type="module"></script>
  </body>
</html>
