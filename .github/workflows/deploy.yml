name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping deploys; let the newest push win.
concurrency:
  group: deploy-production
  cancel-in-progress: true

# The job only reads the repo; it authenticates to the VPS with a deploy key.
permissions:
  contents: read

env:
  # The box moved in 2026-07; the previous address still answered ping but had
  # port 22 closed, which is why every deploy since 2026-06-06 was dead in the
  # water. Host is <vps-host>, tailnet 100.64.0.2.
  VPS_HOST: <origin-ip>
  VPS_USER: root
  REMOTE_DIR: /opt/stacks/website

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Everything below the deploy line is irreversible — rsync --delete overwrites
      # the live site. Fail here instead.
      - name: Validate content
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      # A syntax error here takes the site down on `docker compose up -d`.
      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # This repo owns the site content and the Caddy config. It does NOT own
      # compose.yaml — /opt/stacks is a governed GitOps repo and the stack
      # definition (mem limits, security_opt, tailnet binding) lives there.
      # Pushing a second docker-compose.yml alongside it is how you get two
      # sources of truth that silently disagree.
      - name: Sync site to VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "mkdir -p $REMOTE_DIR/site"
          # status.json is generated ON THE BOX by cron (gen-status.sh, homelab-gitops) and
          # is not part of the build output. Without the exclude, --delete removes
          # it on every deploy and /uses/ silently loses its live state until the
          # next cron tick.
          rsync -avz --delete --exclude=status.json -e "ssh -i ~/.ssh/id_ed25519" \
            out/ "$VPS_USER@$VPS_HOST:$REMOTE_DIR/site/"
          # --inplace is load-bearing: Caddyfile is a SINGLE-FILE bind mount, and
          # rsync's default write-temp-then-rename gives it a new inode. The mount
          # stays pinned to the old one, so the container keeps serving the old
          # config no matter how many times you reload it.
          rsync -avz --inplace -e "ssh -i ~/.ssh/id_ed25519" \
            deploy/Caddyfile "$VPS_USER@$VPS_HOST:$REMOTE_DIR/"

      # Static files are already live at this point; this only applies a Caddyfile
      # change. `docker compose up -d` alone is a no-op here — the compose spec is
      # unchanged, so the container is not recreated and Caddy never re-reads its
      # config. Reload explicitly, and fail loudly if the config is invalid.
      - name: Reload Caddy
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" \
            "cd $REMOTE_DIR && docker compose up -d && \
             docker exec website-caddy caddy reload --config /etc/caddy/Caddyfile"

      # Every request carries a cache-busting query so this tests what was just
      # deployed rather than Cloudflare's copy of what was there before. HTML is
      # served with s-maxage=600, so without it /blog/ can answer 200 from the
      # edge for ten minutes after the page has stopped existing. The redirect
      # matchers use `path`, which ignores the query, so the buster cannot change
      # what is being tested.
      - name: Verify the site is serving
        run: |
          CB="cb=${GITHUB_SHA}"
          for path in / /writing/ /projects/ /about/ /cv/ /links/ /feed.xml; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://hrabovskyi.online$path?$CB")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done

          # Routes moved in 2026-08 and these redirects are the only thing keeping
          # the old URLs alive — a static export cannot redirect, so if the
          # Caddyfile did not reload, every one of these 404s. Both published post
          # addresses are in feed readers, so this is not a cosmetic check.
          # Caddy's `redir` emits the destination verbatim, so the cache-buster is
          # dropped from Location rather than carried through — verified against a
          # real Caddy serving a real build, not assumed.
          check_redirect() {
            got=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "https://hrabovskyi.online$1?$CB")
            echo "$1 -> $got"
            if [ "$got" != "301 https://hrabovskyi.online$2" ]; then
              echo "  expected: 301 https://hrabovskyi.online$2"
              exit 1
            fi
          }
          check_redirect /blog/                  /writing/
          check_redirect /posts/silent-deploys/  /writing/silent-deploys/
          check_redirect /tags/debugging/        /topics/debugging/
          check_redirect /resume/                /cv/
          check_redirect /now/                   /about/
          check_redirect /uses/                  /about/
