name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping deploys; let the newest push win.
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  VPS_HOST: 37.27.211.58
  VPS_USER: root
  REMOTE_DIR: /opt/stacks/website

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync site to VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "mkdir -p $REMOTE_DIR/site"
          rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519" \
            out/ "$VPS_USER@$VPS_HOST:$REMOTE_DIR/site/"
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519" \
            deploy/Caddyfile deploy/docker-compose.yml \
            "$VPS_USER@$VPS_HOST:$REMOTE_DIR/"

      - name: Bring the stack up
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" \
            "cd $REMOTE_DIR && docker compose up -d"
