name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and a running one is never cancelled: a cancelled run
# can leave a published build unverified. A push during a deploy waits; a newer
# push replaces a deploy that is still waiting.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# contents: write publishes the build to the deploy-site release, which the VPS
# pulls. Nothing here reaches the VPS: it has no inbound deploy path (M5.7).
permissions:
  contents: write

# bash, not the default shell, so every step also runs with -o pipefail.
defaults:
  run:
    shell: bash

env:
  SITE: https://hrabovskyi.online
  # The Caddy that validates and tests the Caddyfile. Pin it to the box's.
  CADDY_IMAGE: caddy:2-alpine

jobs:
  build-and-deploy:
    # A dispatch can run this file from any ref. Only main deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Everything before "Publish" is a gate: nothing can reach the box yet. It
      # is CI's chain without the browser smoke test.
      - name: Validate content
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Check the build output
        run: npm run check

      # Caddy's --watch keeps the old config when a new file fails to load, so a
      # broken Caddyfile would fail silently on the box. It fails here instead.
      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$CADDY_IMAGE" caddy validate --config /etc/caddy/Caddyfile

      - name: Test the Caddyfile against this build
        run: bash scripts/caddy-test.sh

      # --index-files is what lets --include-fragments see into a directory link:
      # /cv/#umbraco resolves to out/cv/index.html, as the server resolves it.
      - name: Check links in the built site
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --include-fragments
            --index-files index.html
            --no-progress
            --root-dir ${{ github.workspace }}/out
            --exclude-path out/_next
            "out/**/*.html"
          fail: true

      - name: Stamp the commit into the Caddyfile
        run: |
          sed "s/__DEPLOY_REV__/$GITHUB_SHA/" deploy/Caddyfile > "$RUNNER_TEMP/Caddyfile"
          grep -qF "X-Site-Rev \"$GITHUB_SHA\"" "$RUNNER_TEMP/Caddyfile"

      # The box (homelab-gitops host/website-pull.sh, M5.7) fetches this archive
      # from the `deploy-site` release every 2 minutes, checks its sha256 and
      # installs it in three passes: /_next/ without --delete (HTML still cached
      # at the edge names the old chunks), the Caddyfile in place, then the rest
      # with --delete except /_next/ and /status.json. It carries the stamped
      # Caddyfile: the placeholder one would serve X-Site-Rev "__DEPLOY_REV__",
      # which the live verify and the probe both reject.
      - name: Package the build
        run: |
          echo "$GITHUB_SHA" > out/build.txt
          mkdir pkg && cp -r out pkg/out && cp "$RUNNER_TEMP/Caddyfile" pkg/Caddyfile
          tar -czf site.tar.gz -C pkg .
          sha256sum site.tar.gz | awk '{print $1"  site.tar.gz"}' > site.tar.gz.sha256

      # A moving prerelease, never "latest": it is a mailbox, not a release.
      # --clobber swaps the two assets one after the other; the box tolerates a
      # run that lands in between.
      - name: Publish to the deploy-site release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view deploy-site >/dev/null 2>&1 || gh release create deploy-site \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "deploy-site (moving)" --notes "Pulled by the VPS every 2 minutes. Replaced on every push to main."
          gh release upload deploy-site site.tar.gz site.tar.gz.sha256 --clobber

      # The box polls every 2 minutes and installs build.txt in its last pass,
      # so this commit's build.txt means the whole build has landed. The query
      # string misses the edge cache, which holds .txt for up to 10 minutes.
      - name: Wait for the box to pull this build
        id: landed
        run: |
          deadline=$((SECONDS + 360))
          until [ "$(curl -fsS --max-time 10 "$SITE/build.txt?cb=$GITHUB_SHA-$SECONDS" 2>/dev/null)" = "$GITHUB_SHA" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=The box did not pull this build::$SITE/build.txt does not name $GITHUB_SHA after 6 minutes. Check /var/log/website-pull.log on the VPS."
              exit 1
            fi
            sleep 10
          done
          echo "live after ${SECONDS}s"

      # Optional, and only with both secrets. Without them, HTML reaches readers
      # when the edge's copy expires (s-maxage=600).
      - name: Purge the Cloudflare cache
        id: purge
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_PURGE_TOKEN" ]; then exit 0; fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_PURGE_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | jq -e .success >/dev/null
          echo "purged=true" >> "$GITHUB_OUTPUT"
          echo "Cloudflare cache purged"

      # Waits up to 60 s for X-Site-Rev to name this commit (Caddy has loaded the
      # new Caddyfile), then repeats the build's tests on the live site: this
      # build's id in /, the pages, the redirects, the cards, the 404s, the CSP
      # and robots.txt. Cache-Control is left to the local run (see the script).
      # Runs even when the purge failed: once the build has landed, whether the
      # live site is healthy is the thing to know.
      - name: Verify the live site
        if: ${{ !cancelled() && steps.landed.outcome == 'success' }}
        run: BASE_URL="$SITE" EXPECT_REV="$GITHUB_SHA" bash scripts/caddy-test.sh
