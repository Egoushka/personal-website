name: CI

# Same checks the deploy runs, but on branches and PRs so failures surface before
# anything reaches main — where a push is a live deploy.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

# One Caddy for every step that runs one: caddy validate, caddy-test, serve:prod.
# Pin it to the version the box runs.
env:
  CADDY_IMAGE: caddy:2-alpine

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate content
        run: npm run validate

      # The docs copies against the commits they claim to be (ADR 0006). The
      # only step that reaches GitHub for content; the build itself stays offline.
      - name: Verify vendored docs
        run: npm run docs:verify

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static export
        id: build
        run: npm run build

      # Every check below reads the build, and each one runs even when an earlier
      # one failed: one red run should list everything that is wrong, not the first.
      - name: Assert the build output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check

      - name: Validate Caddyfile
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$CADDY_IMAGE" caddy validate --config /etc/caddy/Caddyfile

      # Redirects, content types, 404s and headers, from the real Caddyfile over out/.
      # It leaves that container serving on :8080, which the smoke test uses.
      - name: Caddy behaviour
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run caddy-test

      - name: Install Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      # The browser checks run against Caddy with the production CSP, because the
      # bugs they exist for (an eval the CSP refused, a shift after hydration) never
      # showed up on a bare file server.
      - name: Browser smoke test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          # serve:prod publishes on 127.0.0.1 only; "localhost" may resolve to ::1 first.
          BASE_URL: http://127.0.0.1:8080
        run: npm run smoke

      # --offline checks that internal hrefs resolve to real files and skips the
      # network entirely, so external link rot can never make this gate flaky.
      - name: Check internal links in the built site
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --root-dir (absolute) is what resolves root-relative hrefs like "/blog/"
          # against the build output. --base-url only accepts a full URL and rejects
          # a relative path outright. --include-fragments also resolves #anchors, and
          # needs --index-files: without it "/cv/#umbraco" is looked up in the
          # directory out/cv, not in out/cv/index.html, and every such link fails.
          args: >-
            --offline
            --no-progress
            --include-fragments
            --index-files index.html
            --root-dir ${{ github.workspace }}/out
            --exclude-path out/_next
            "out/**/*.html"
          fail: true

  # The repo is public: no secret and no personal address reaches it.
  secrets:
    runs-on: ubuntu-latest
    # On pull requests gitleaks-action lists the PR's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Prints short hashes only: echoing the offending address would publish it in the log.
      - name: Every commit uses a GitHub noreply address
        run: |
          bad=$(git log --format='%h %ae%n%h %ce' \
            | grep -vE ' ([^ @]+@users\.noreply\.github\.com|noreply@github\.com)$' || true)
          if [ -n "$bad" ]; then
            echo "Commits with an address that is not a GitHub noreply one:"
            echo "$bad" | cut -d' ' -f1 | sort -u
            exit 1
          fi
