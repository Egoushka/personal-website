name: Prelive

# The same build as production, served from a second root on the same Caddy
# container, published to the tailnet only. This runs for every pull request
# and only publishes: the box pulls `deploy-prelive` into the prelive root, and
# nothing here can reach production.
on:
  workflow_dispatch:
  pull_request:

# One prelive, so the newest run wins. Separate from `deploy-production` on
# purpose: a prelive run must never cancel a real deploy.
concurrency:
  group: deploy-prelive
  cancel-in-progress: true

# contents: write publishes the build to the deploy-prelive release, which the
# VPS pulls. A fork PR never gets here (the job's `if`).
permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  PRELIVE_ORIGIN: http://100.64.0.2:8091
  CADDY_IMAGE: caddy:2-alpine

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # A pull request from a fork gets no secrets, and neither does one that
    # Dependabot opens, so the key check would fail every time. Skip the job.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      # SITE_URL is what makes this a separate site rather than a second copy of
      # production claiming production's addresses. Without it the comment widget
      # on a prelive post writes into the live thread for that post.
      - name: Build static export
        run: npm run build
        env:
          SITE_URL: ${{ env.PRELIVE_ORIGIN }}

      # Prelive does NOT ship deploy/Caddyfile, and that is the point: the file
      # carries the production :80 block too, so rsyncing it from a branch would
      # change the live site's config before the change was ever merged (and the
      # prelive key cannot reach it anyway). It is only validated here; it
      # reaches the box with the next production deploy.
      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$CADDY_IMAGE" caddy validate --config /etc/caddy/Caddyfile

      # The box (homelab-gitops host/website-pull.sh, M5.7) fetches this archive
      # from the `deploy-prelive` release every 2 minutes, checks its sha256 and
      # mirrors out/ into the prelive root. It never takes a Caddyfile from here.
      - name: Package the build
        run: |
          echo "$GITHUB_SHA" > out/build.txt
          mkdir pkg && cp -r out pkg/out
          tar -czf site.tar.gz -C pkg .
          sha256sum site.tar.gz | awk '{print $1"  site.tar.gz"}' > site.tar.gz.sha256

      # A moving prerelease, never "latest": it is a mailbox, not a release.
      # --clobber swaps the two assets one after the other; the box tolerates a
      # run that lands in between.
      - name: Publish to the deploy-prelive release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view deploy-prelive >/dev/null 2>&1 || gh release create deploy-prelive \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "deploy-prelive (moving)" --notes "Pulled by the VPS every 2 minutes. Replaced on every prelive run; out/ only, never the Caddyfile."
          gh release upload deploy-prelive site.tar.gz site.tar.gz.sha256 --clobber

      # No verification step: the runner cannot reach the tailnet. Open the link
      # below from a tailnet device; `build.txt` there names the commit.
      - name: Where to look
        run: |
          {
            echo "### Prelive updated"
            echo ""
            echo "<$PRELIVE_ORIGIN/> — tailnet only, from \`${GITHUB_REF_NAME}\`, within about 2 minutes (the box pulls \`deploy-prelive\`)"
          } >> "$GITHUB_STEP_SUMMARY"
