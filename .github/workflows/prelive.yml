name: Prelive

# The same build as production, served from a second root on the same Caddy
# container, published to the tailnet only. Nothing here touches the live site.
on:
  workflow_dispatch:
  pull_request:

# One prelive, so the newest run wins. Separate from `deploy-production` on
# purpose: a prelive run must never cancel a real deploy.
concurrency:
  group: deploy-prelive
  cancel-in-progress: true

permissions:
  contents: read

env:
  VPS_HOST: <origin-ip>
  # Deploys as `webdeploy`, not root. Its only command on the box is
  # `rrsync -wo /opt/stacks/website` (forced in authorized_keys), so every
  # remote path below is relative to /opt/stacks/website and nothing but a
  # write-only rsync is possible: no shell, no docker, no reads. Until
  # 2026-09-24 this key was an unrestricted root login on public :22.
  VPS_USER: webdeploy
  # Baked into canonicals, both feeds, the sitemap, the OG cards and the URL
  # each post's comment thread is keyed by — see lib/site.ts.
  #
  # 100.64.0.2, settled by the file that actually binds the port:
  # homelab-gitops website/compose.yaml publishes "100.64.0.2:8090:80" and now
  # "100.64.0.2:8091:81". This repo had it written down twice and disagreeing —
  # the Caddyfile's comment said .4 and was wrong. Still the only place the
  # address appears in a build.
  PRELIVE_ORIGIN: http://100.64.0.2:8091

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # A pull_request from a fork gets no secrets, so the SSH steps would fail
    # halfway through rather than not run. Skip the whole job instead.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      # SITE_URL is what makes this a separate site rather than a second copy of
      # production claiming production's addresses. Without it the comment widget
      # on a prelive post writes into the live thread for that post.
      - name: Build static export
        run: npm run build
        env:
          SITE_URL: ${{ env.PRELIVE_ORIGIN }}

      # Prelive does NOT ship deploy/Caddyfile, and that is the point: the file
      # carries the production :80 block too, so rsyncing it from a branch would
      # change the live site's config before the change was ever merged. It is
      # only validated here; it reaches the box with the next production deploy.
      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # A sibling of site/, never inside it: --delete on one must not be able to
      # reach the other. No status.json exclude here — that file is generated on
      # the box for production only, and prelive rendering /about/ without live
      # status is the correct degraded state, not a bug to hide.
      - name: Sync prelive to VPS
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519" \
            out/ "$VPS_USER@$VPS_HOST:prelive/"

      # No verification step: prelive is tailnet-only (100.64.0.2:8091), the
      # runner cannot reach it, and the deploy key can no longer `docker exec`
      # a probe on the box. rsync failing still fails the job. Open the link
      # below from a tailnet device.
      - name: Where to look
        run: |
          echo "### Prelive updated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<$PRELIVE_ORIGIN/> — tailnet only, from \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
