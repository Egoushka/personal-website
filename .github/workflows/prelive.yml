name: Prelive

# The same build as production, served from a second root on the same Caddy
# container, published to the tailnet only. This runs for every pull request,
# so it deploys with a key of its own that can write the prelive root and
# nothing else — never the production key.
on:
  workflow_dispatch:
  pull_request:

# One prelive, so the newest run wins. Separate from `deploy-production` on
# purpose: a prelive run must never cancel a real deploy.
concurrency:
  group: deploy-prelive
  cancel-in-progress: true

# contents: write publishes the build to the deploy-prelive release, which the
# VPS pulls. A fork PR never gets here (the job's `if`).
permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  VPS_HOST: <origin-ip>
  # PRELIVE_SSH_KEY logs in as webdeploy with a forced
  # `rrsync -wo /opt/stacks/website/prelive`: every remote path below is
  # relative to the prelive root, and a write-only rsync is all it can do.
  VPS_USER: webdeploy
  # Baked into canonicals, both feeds, the sitemap, the OG cards and the URL
  # each post's comment thread is keyed by — see lib/site.ts. It is the address
  # homelab-gitops website/compose.yaml binds: "100.64.0.2:8091:81".
  PRELIVE_ORIGIN: http://100.64.0.2:8091
  CADDY_IMAGE: caddy:2-alpine

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # A pull request from a fork gets no secrets, and neither does one that
    # Dependabot opens, so the key check would fail every time. Skip the job.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      # SITE_URL is what makes this a separate site rather than a second copy of
      # production claiming production's addresses. Without it the comment widget
      # on a prelive post writes into the live thread for that post.
      - name: Build static export
        run: npm run build
        env:
          SITE_URL: ${{ env.PRELIVE_ORIGIN }}

      # Prelive does NOT ship deploy/Caddyfile, and that is the point: the file
      # carries the production :80 block too, so rsyncing it from a branch would
      # change the live site's config before the change was ever merged (and the
      # prelive key cannot reach it anyway). It is only validated here; it
      # reaches the box with the next production deploy.
      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$CADDY_IMAGE" caddy validate --config /etc/caddy/Caddyfile

      # The pull path (homelab-gitops host/website-pull.sh, M5.7): the box fetches
      # this archive from the `deploy-prelive` release every 2 minutes and checks its
      # sha256, so it needs no inbound SSH. It runs alongside the rsync below until
      # it is verified; then the rsync and the deploy key go.
      - name: Package the build
        run: |
          echo "$GITHUB_SHA" > out/build.txt
          mkdir pkg && cp -r out pkg/out
          tar -czf site.tar.gz -C pkg .
          sha256sum site.tar.gz | awk '{print $1"  site.tar.gz"}' > site.tar.gz.sha256

      # A moving prerelease, never "latest": it is a mailbox, not a release.
      # --clobber swaps the two assets one after the other; the box tolerates a
      # run that lands in between.
      - name: Publish to the deploy-prelive release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view deploy-prelive >/dev/null 2>&1 || gh release create deploy-prelive \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "deploy-prelive (moving)" --notes "Pulled by the VPS every 2 minutes. Replaced on every prelive run; out/ only, never the Caddyfile."
          gh release upload deploy-prelive site.tar.gz site.tar.gz.sha256 --clobber

      # The pull path above needs no key; the rsync below does. The check sits here,
      # after publishing, so a missing key stops only the rsync.
      - name: Require the prelive key
        env:
          PRELIVE_SSH_KEY: ${{ secrets.PRELIVE_SSH_KEY }}
        run: |
          if [ -z "$PRELIVE_SSH_KEY" ]; then
            echo "::error title=PRELIVE_SSH_KEY is not set::Prelive deploys with its own key, forced to 'rrsync -wo /opt/stacks/website/prelive' in webdeploy's authorized_keys (README, Prelive). It never falls back to the production key."
            exit 1
          fi

      - name: Configure SSH
        env:
          PRELIVE_SSH_KEY: ${{ secrets.PRELIVE_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PRELIVE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # The key's forced root is all that keeps --delete out of production's
      # files. The same sync as a dry run first: if it would touch site/, the
      # Caddyfile or production's status.json, the key was set up with the wrong
      # root, and the job stops before anything is sent.
      - name: Check the key's root with a dry run
        run: |
          rsync -azn --delete --itemize-changes -e "ssh -i $HOME/.ssh/id_ed25519" \
            out/ "$VPS_USER@$VPS_HOST:./" > "$RUNNER_TEMP/prelive-plan.txt"
          bash deploy/prelive-guard.sh < "$RUNNER_TEMP/prelive-plan.txt"

      # The prelive root is a sibling of site/, never inside it, so --delete here
      # cannot reach production. No status.json exclude: that file is generated on
      # the box for production only, and prelive rendering without live status is
      # the correct degraded state, not a bug to hide.
      - name: Sync prelive to VPS
        run: |
          rsync -azi --delete -e "ssh -i $HOME/.ssh/id_ed25519" \
            out/ "$VPS_USER@$VPS_HOST:./"

      # No verification step: the runner cannot reach the tailnet, and the key can
      # only rsync. rsync failing still fails the job. Open the link below from a
      # tailnet device.
      - name: Where to look
        run: |
          {
            echo "### Prelive updated"
            echo ""
            echo "<$PRELIVE_ORIGIN/> — tailnet only, from \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
